<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>安適美 AI 膚況評估</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --rose:#C4848A;--rose-d:#A66068;--rose-l:#E8B4B8;--rose-p:#FDF5F5;
  --gold:#C9A96E;--gold-l:#E8D5B0;
  --dark:#1C1215;--mid:#6B4A4E;--muted:#B89A9C;
  --bg:#FDFAF9;--surf:#F7F0F0;--border:#EDD8D8;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,20px);
  --ff-d:'Cormorant Garamond',Georgia,serif;--ff-b:'Noto Sans TC',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--ff-b);color:var(--dark)}
button{cursor:pointer;font-family:var(--ff-b);border:none;outline:none}

/* ── APP ── */
#app{position:fixed;inset:0;overflow:hidden}

/* ── SCREENS ── */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  opacity:0;pointer-events:none;transform:translateY(16px);
  transition:opacity .4s ease,transform .4s ease;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0)}

/* ── SCREEN 1 WELCOME ── */
#s-welcome{
  background:linear-gradient(160deg,#FDF5F5 0%,#FAF0F0 40%,#F5E8E8 100%);
  justify-content:center;padding:calc(var(--safe-t)+24px) 28px calc(var(--safe-b)+32px);
}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

.brand{text-align:center;margin-bottom:40px}
.brand-ch{font:300 38px/1 var(--ff-d);letter-spacing:.15em;color:var(--rose)}
.brand-en{font-size:9px;letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-top:6px}

/* Decorative emblem */
.emblem{position:relative;width:160px;height:160px;margin:0 auto 36px}
.emblem-bg{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0%,var(--rose-p) 100%);border:1px solid var(--border)}
.emblem-ring1{position:absolute;inset:-18px;border-radius:50%;border:1px solid var(--border);opacity:.5;animation:rot 14s linear infinite}
.emblem-ring2{position:absolute;inset:-32px;border-radius:50%;border:1px dashed var(--gold-l);opacity:.3;animation:rot 22s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.emblem svg{position:absolute;inset:0;margin:auto;width:78px;height:78px}
.ring-gem{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.ring-gem:nth-child(1){top:-3px;left:50%;transform:translateX(-50%)}
.ring-gem:nth-child(2){bottom:-3px;left:50%;transform:translateX(-50%)}
.ring-gem:nth-child(3){left:-3px;top:50%;transform:translateY(-50%)}
.ring-gem:nth-child(4){right:-3px;top:50%;transform:translateY(-50%)}

.welcome-h{font:400 20px/1.5 var(--ff-d);letter-spacing:.05em;text-align:center;color:var(--dark);margin-bottom:10px}
.welcome-p{font-size:13px;color:var(--mid);line-height:1.9;text-align:center;max-width:260px;margin-bottom:32px}

/* Steps */
.steps{display:flex;align-items:flex-start;width:100%;max-width:300px;margin-bottom:36px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.step-ic{width:50px;height:50px;border-radius:14px;background:var(--rose-p);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.step-ic svg{width:22px;height:22px;stroke:var(--rose);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.step-t{font-size:11px;color:var(--mid);text-align:center;line-height:1.4}
.step-line{flex:0 0 24px;height:1px;background:var(--border);margin-top:25px}

/* Buttons */
.btn-main{
  width:100%;max-width:300px;padding:17px 20px;
  background:linear-gradient(135deg,var(--rose) 0%,var(--rose-d) 100%);
  color:#fff;border-radius:100px;font:500 14px/1 var(--ff-b);
  letter-spacing:.08em;box-shadow:0 8px 28px rgba(196,132,138,.38);
  transition:transform .15s,box-shadow .15s;
}
.btn-main:active{transform:scale(.97);box-shadow:0 3px 10px rgba(196,132,138,.25)}
.btn-ghost{
  margin-top:14px;width:100%;max-width:300px;padding:15px 20px;
  background:transparent;color:var(--rose);
  border:1.5px solid var(--rose-l);border-radius:100px;
  font:400 14px/1 var(--ff-b);letter-spacing:.04em;
  transition:background .15s;
}
.btn-ghost:active{background:var(--rose-p)}
.privacy{font-size:11px;color:var(--muted);margin-top:16px;text-align:center}

/* ── SCREEN 2 CAMERA ── */
#s-camera{background:#120A0B;padding:0;justify-content:stretch;align-items:stretch}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#video.mirror{transform:scaleX(-1)}
.cam-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--safe-t)+48px) 0 calc(var(--safe-b)+36px)}
.cam-top{text-align:center}
.cam-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(18,10,11,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:100px;padding:9px 18px;font-size:12.5px;color:rgba(255,255,255,.85);letter-spacing:.03em}
.cam-blink{width:7px;height:7px;border-radius:50%;background:var(--rose-l);animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.face-guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);width:min(60vw,220px);aspect-ratio:3/4;pointer-events:none}
.face-guide svg{width:100%;height:100%;overflow:visible}
.cam-hint{text-align:center}
.cam-hint span{display:inline-block;font-size:12px;color:rgba(255,255,255,.7);background:rgba(18,10,11,.5);backdrop-filter:blur(10px);border-radius:100px;padding:8px 18px}
.cam-controls{display:flex;align-items:center;justify-content:center;gap:48px;padding:0 32px}
.cam-sm{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;transition:background .15s}
.cam-sm:active{background:rgba(255,255,255,.22)}
.cam-sm svg{width:22px;height:22px;stroke:rgba(255,255,255,.9);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.shutter{width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);position:relative;transition:transform .12s}
.shutter::after{content:'';position:absolute;inset:8px;border-radius:50%;background:#fff;transition:transform .12s}
.shutter:active{transform:scale(.92)}
.shutter:active::after{transform:scale(.88)}

/* ── SCREEN 3 PREVIEW ── */
#s-preview{background:#120A0B;padding:0;align-items:stretch;justify-content:stretch}
#preview-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preview-foot{position:absolute;bottom:0;left:0;right:0;padding:64px 28px calc(var(--safe-b)+36px);background:linear-gradient(transparent,rgba(18,10,11,.88));display:flex;flex-direction:column;align-items:center;gap:18px}
.preview-label{font-size:15px;color:rgba(255,255,255,.88);letter-spacing:.04em}
.preview-actions{display:flex;gap:12px;width:100%;max-width:310px}
.btn-retake{flex:1;padding:15px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.22);border-radius:100px;font:400 14px/1 var(--ff-b);transition:background .15s}
.btn-retake:active{background:rgba(255,255,255,.22)}
.btn-analyze{flex:2;padding:15px;background:var(--rose);color:#fff;border-radius:100px;font:500 14px/1 var(--ff-b);box-shadow:0 6px 24px rgba(196,132,138,.5);transition:transform .12s}
.btn-analyze:active{transform:scale(.97)}

/* ── SCREEN 4 LOADING ── */
#s-loading{background:var(--bg);justify-content:center;padding:40px 28px}
.ai-orb{position:relative;width:140px;height:140px;margin-bottom:40px}
.orb-r{position:absolute;inset:0;border-radius:50%}
.orb-r1{border:1px solid var(--border);animation:rot 5s linear infinite}
.orb-r2{inset:16px;border:1.5px solid transparent;border-top-color:var(--rose);border-right-color:var(--rose-l);animation:rot 2.4s linear infinite}
.orb-r3{inset:30px;border:1px solid transparent;border-bottom-color:var(--rose-l);animation:rot 3.5s linear infinite reverse}
.orb-center{position:absolute;inset:44px;border-radius:50%;background:var(--rose-p);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.orb-center svg{width:26px;height:26px;stroke:var(--rose);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.load-title{font:400 20px/1 var(--ff-d);letter-spacing:.06em;color:var(--dark);margin-bottom:10px;text-align:center}
.load-sub{font-size:13px;color:var(--mid);text-align:center;line-height:1.8;max-width:240px;margin-bottom:36px}
.scan-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:260px}
.scan-row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);transition:color .5s}
.scan-row.on{color:var(--rose)}.scan-row.done{color:var(--mid)}
.scan-ic{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .4s,background .4s}
.scan-row.on .scan-ic{border-color:var(--rose);background:var(--rose-p)}
.scan-row.done .scan-ic{border-color:var(--mid);background:var(--surf)}
.scan-dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background .4s}
.scan-row.on .scan-dot{background:var(--rose);animation:blink 1.4s ease-in-out infinite}
.scan-row.done .scan-dot{display:none}
.scan-chk{display:none;width:11px;height:8px}
.scan-chk path{stroke:var(--mid);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.scan-row.done .scan-chk{display:block}

/* ── SCREEN 5 RESULT ── */
#s-result{background:var(--bg);justify-content:flex-start;padding:calc(var(--safe-t)+20px) 0 calc(var(--safe-b)+32px)}
.result-header{text-align:center;padding:24px 28px 20px}
.result-logo{font:300 24px/1 var(--ff-d);letter-spacing:.12em;color:var(--rose)}
.result-logo-en{font-size:9px;letter-spacing:.4em;color:var(--gold);margin-top:4px;text-transform:uppercase}
.result-title{font:400 17px/1 var(--ff-d);color:var(--dark);margin-top:16px}
.result-divider{width:48px;height:1px;background:var(--gold-l);margin:12px auto 0}

/* Overall assessment */
.assess-card{margin:16px 20px;background:linear-gradient(135deg,var(--rose-p),#FAF0F0);border:1px solid var(--border);border-radius:20px;padding:18px 20px}
.assess-label{font-size:10px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.assess-text{font-size:14px;color:var(--dark);line-height:1.8}

/* Issues */
.section-hd{font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin:20px 20px 10px}
.issues-wrap{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.issue-pill{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surf);border:1px solid var(--border);border-radius:12px}
.issue-bar{width:3px;height:32px;border-radius:2px;background:var(--rose-l);flex-shrink:0}
.issue-bar.sev-mid{background:var(--rose)}
.issue-bar.sev-hi{background:var(--rose-d)}
.issue-name{font-size:13px;font-weight:500;color:var(--dark)}
.issue-desc{font-size:11.5px;color:var(--mid);margin-top:2px}

/* Rec cards */
.recs-wrap{padding:0 20px;display:flex;flex-direction:column;gap:12px}
.rec-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(196,132,138,.08)}
.rec-card-top{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.rec-rank{width:32px;height:32px;border-radius:10px;background:var(--rose-p);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.rec-info{flex:1}
.rec-name{font-size:14px;font-weight:500;color:var(--dark);line-height:1.3}
.rec-cat{font-size:10px;color:var(--gold);letter-spacing:.1em;margin-top:3px}
.rec-body{padding:0 16px 14px}
.rec-reason{font-size:12.5px;color:var(--mid);line-height:1.75}
.rec-effect{display:flex;align-items:center;gap:7px;margin-top:10px;padding:9px 12px;background:var(--rose-p);border-radius:10px;font-size:12px;color:var(--rose)}

/* CTA */
.cta-wrap{margin:24px 20px 0;display:flex;flex-direction:column;gap:10px}
.btn-book{width:100%;padding:17px;background:linear-gradient(135deg,var(--rose),var(--rose-d));color:#fff;border-radius:14px;font:500 15px/1 var(--ff-b);letter-spacing:.06em;box-shadow:0 8px 24px rgba(196,132,138,.35);transition:transform .15s}
.btn-book:active{transform:scale(.98)}
.btn-tel{width:100%;padding:15px;background:transparent;color:var(--rose);border:1.5px solid var(--rose-l);border-radius:14px;font:400 14px/1 var(--ff-b);transition:background .15s}
.btn-tel:active{background:var(--rose-p)}
.btn-web{width:100%;padding:13px;background:transparent;color:var(--muted);border:none;font:400 13px/1 var(--ff-b)}
.note-card{margin:16px 20px 0;background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--mid);line-height:1.7;text-align:center}

/* ── CANVAS ── */
canvas{display:none;position:absolute}
</style>
</head>
<body>
<div id="app">
<div class="grain"></div>

<!-- ════ SCREEN 1 WELCOME ════ -->
<section class="screen active" id="s-welcome">
  <div class="brand">
    <div class="brand-ch">安適美</div>
    <div class="brand-en">ANSMED · AI Skin Analysis</div>
  </div>

  <div class="emblem">
    <div class="emblem-bg"></div>
    <div class="emblem-ring1">
      <div class="ring-gem"></div><div class="ring-gem"></div>
      <div class="ring-gem"></div><div class="ring-gem"></div>
    </div>
    <div class="emblem-ring2"></div>
    <svg viewBox="0 0 78 78" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="39" cy="30" rx="17" ry="21" stroke="#C4848A" stroke-width="1.2"/>
      <path d="M22 62 C22 48 56 48 56 62" stroke="#C4848A" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="33" cy="27" r="2.2" fill="#C4848A" opacity=".55"/>
      <circle cx="45" cy="27" r="2.2" fill="#C4848A" opacity=".55"/>
      <path d="M33.5 37 Q39 41.5 44.5 37" stroke="#C4848A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <path d="M39 5 L39 9" stroke="#C9A96E" stroke-width="1" stroke-linecap="round"/>
      <path d="M36 7 L42 7" stroke="#C9A96E" stroke-width="1" stroke-linecap="round"/>
      <line x1="24" y1="14" x2="27" y2="18" stroke="#E8B4B8" stroke-width="1" stroke-linecap="round"/>
      <line x1="54" y1="14" x2="51" y2="18" stroke="#E8B4B8" stroke-width="1" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="welcome-h">AI 個人化膚況評估<br>找到最適合你的療程</div>
  <div class="welcome-p">只需一張自拍，AI 即時分析臉部膚況，為你量身推薦安適美專屬療程方案</div>

  <div class="steps">
    <div class="step">
      <div class="step-ic"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div class="step-t">拍攝<br>或上傳</div>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-ic"><svg viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 0 0-2 2v4M9 3h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg></div>
      <div class="step-t">AI<br>分析</div>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-ic"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
      <div class="step-t">專屬<br>推薦</div>
    </div>
  </div>

  <button class="btn-main" onclick="startCamera()">📷 拍照評估</button>
  <button class="btn-ghost" onclick="pickFromGallery()">🖼️ 從相簿選擇</button>
  <div class="privacy">📸 照片僅供 AI 分析，完成後立即刪除</div>
</section>

<!-- ════ SCREEN 2 CAMERA ════ -->
<section class="screen" id="s-camera">
  <video id="video" autoplay playsinline muted></video>
  <div class="cam-ui">
    <div class="cam-top">
      <div class="cam-pill"><div class="cam-blink"></div>對準臉部・保持光線充足</div>
    </div>
    <div class="face-guide">
      <svg viewBox="0 0 220 294" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="110" cy="147" rx="107" ry="143" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
        <ellipse cx="110" cy="147" rx="107" ry="143" stroke="rgba(255,255,255,.12)" stroke-width="1" stroke-dasharray="5 4"/>
        <line x1="110" y1="0" x2="110" y2="12" stroke="#E8B4B8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="104" y1="6" x2="116" y2="6" stroke="#E8B4B8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="110" y1="282" x2="110" y2="294" stroke="#E8B4B8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="104" y1="288" x2="116" y2="288" stroke="#E8B4B8" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="cam-hint"><span>將臉部置於橢圓框內</span></div>
    <div class="cam-controls">
      <button class="cam-sm" onclick="cancelCam()" aria-label="取消">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <button class="shutter" onclick="snap()" aria-label="拍照"></button>
      <button class="cam-sm" onclick="flipCam()" aria-label="翻轉">
        <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- ════ SCREEN 3 PREVIEW ════ -->
<section class="screen" id="s-preview">
  <img id="preview-img" src="" alt="預覽">
  <div class="preview-foot">
    <div class="preview-label">確認照片清晰嗎？</div>
    <div class="preview-actions">
      <button class="btn-retake" onclick="retake()">重拍</button>
      <button class="btn-analyze" onclick="doAnalyze()">✨ 開始分析</button>
    </div>
  </div>
</section>

<!-- ════ SCREEN 4 LOADING ════ -->
<section class="screen" id="s-loading">
  <div class="ai-orb">
    <div class="orb-r orb-r1"></div>
    <div class="orb-r orb-r2"></div>
    <div class="orb-r orb-r3"></div>
    <div class="orb-center">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>
    </div>
  </div>
  <div class="load-title">AI 正在分析膚況</div>
  <div class="load-sub">請稍候，正在為你<br>進行個人化膚況評估</div>
  <div class="scan-list">
    <div class="scan-row" id="sc1">
      <div class="scan-ic"><div class="scan-dot"></div><svg class="scan-chk" viewBox="0 0 11 8"><path d="M1 4L4 7 10 1"/></svg></div>偵測臉部特徵
    </div>
    <div class="scan-row" id="sc2">
      <div class="scan-ic"><div class="scan-dot"></div><svg class="scan-chk" viewBox="0 0 11 8"><path d="M1 4L4 7 10 1"/></svg></div>分析膚況問題
    </div>
    <div class="scan-row" id="sc3">
      <div class="scan-ic"><div class="scan-dot"></div><svg class="scan-chk" viewBox="0 0 11 8"><path d="M1 4L4 7 10 1"/></svg></div>比對安適美療程清單
    </div>
    <div class="scan-row" id="sc4">
      <div class="scan-ic"><div class="scan-dot"></div><svg class="scan-chk" viewBox="0 0 11 8"><path d="M1 4L4 7 10 1"/></svg></div>整理個人化推薦報告
    </div>
  </div>
</section>

<!-- ════ SCREEN 5 RESULT ════ -->
<section class="screen" id="s-result">
  <div class="result-header">
    <div class="result-logo">安適美 ANSMED</div>
    <div class="result-logo-en">AI Skin Analysis Report</div>
    <div class="result-divider"></div>
    <div class="result-title" id="r-username">專屬膚況評估報告</div>
  </div>

  <!-- Overall -->
  <div class="assess-card">
    <div class="assess-label">整體膚況評估</div>
    <div class="assess-text" id="r-overall">正在載入...</div>
  </div>

  <!-- Issues -->
  <div class="section-hd">🔍 發現的膚況問題</div>
  <div class="issues-wrap" id="r-issues"></div>

  <!-- Recs -->
  <div class="section-hd">💆 為你推薦的療程</div>
  <div class="recs-wrap" id="r-recs"></div>

  <!-- CTA -->
  <div class="cta-wrap">
    <button class="btn-book" onclick="window.open('https://www.ansmed880.com','_blank')">📅 立即預約諮詢</button>
    <button class="btn-tel" onclick="window.open('tel:0658137710')">📞 致電 06-581-3771</button>
    <button class="btn-web" onclick="window.open('https://www.ansmed880.com/blank-1','_blank')">🌐 查看完整服務項目</button>
  </div>

  <div class="note-card" id="r-note"></div>
</section>

<!-- Hidden elements -->
<canvas id="canvas"></canvas>
<input type="file" id="file-input" accept="image/*" style="display:none" onchange="onFileChosen(event)">

</div><!-- #app -->

<script>
// ══ 設定 ══
const CFG = {
  LIFF_ID     : 'YOUR_LIFF_ID_HERE',
  API_ENDPOINT: 'https://your-backend.com/api/analyze'
};

// ══ 狀態 ══
let stream = null, facing = 'user', blob = null, dataURL = null;
let lineUserId = '', lineName = '會員';
let scanTimer = null, scanIdx = 0;

// ══ LIFF 初始化 ══
async function initLiff() {
  try {
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const p = await liff.getProfile();
    lineUserId = p.userId;
    lineName   = p.displayName;
    document.getElementById('r-username').textContent = `${lineName} 的專屬評估報告`;
  } catch (e) { console.error('[LIFF]', e); }
}

// ══ 畫面切換 ══
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  void document.getElementById(id).offsetWidth;
  document.getElementById(id).classList.add('active');
}

// ══ 相機 ══
async function startCamera() {
  try {
    stopStream();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false
    });
    const v = document.getElementById('video');
    v.srcObject = stream;
    v.classList.toggle('mirror', facing === 'user');
    await v.play();
    go('s-camera');
  } catch (e) {
    alert('無法開啟相機，請確認已允許相機權限');
  }
}

function stopStream() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function cancelCam() { stopStream(); go('s-welcome'); }

async function flipCam() {
  facing = facing === 'user' ? 'environment' : 'user';
  await startCamera();
}

function snap() {
  const v = document.getElementById('video');
  if (!v.videoWidth) return;
  const c = document.getElementById('canvas');
  const sz = Math.min(v.videoWidth, v.videoHeight);
  c.width = c.height = sz;
  const ctx = c.getContext('2d');
  const ox = (v.videoWidth - sz) / 2;
  const oy = (v.videoHeight - sz) / 2;
  if (facing === 'user') { ctx.translate(sz, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, ox, oy, sz, sz, 0, 0, sz, sz);
  dataURL = c.toDataURL('image/jpeg', 0.92);
  c.toBlob(b => { blob = b; }, 'image/jpeg', 0.92);
  document.getElementById('preview-img').src = dataURL;
  stopStream();
  go('s-preview');
}

// ══ 相簿 ══
function pickFromGallery() {
  document.getElementById('file-input').click();
}

function onFileChosen(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  blob = file;
  const reader = new FileReader();
  reader.onload = ev => {
    dataURL = ev.target.result;
    document.getElementById('preview-img').src = dataURL;
    go('s-preview');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function retake() {
  blob = null; dataURL = null;
  go('s-welcome');
}

// ══ 分析 ══
async function doAnalyze() {
  if (!blob) { alert('照片遺失，請重試'); return; }
  go('s-loading');
  startScan();

  try {
    const form = new FormData();
    form.append('photo', blob, 'face.jpg');
    form.append('userId', lineUserId || 'dev-test');
    form.append('displayName', lineName);

    const res  = await fetch(CFG.API_ENDPOINT, { method: 'POST', body: form });
    const data = await res.json();

    await new Promise(r => setTimeout(r, Math.max(0, 3500 - Date.now() % 3500)));
    stopScan();

    if (data.success && data.quality_ok !== false) {
      renderResult(data);
      go('s-result');
    } else {
      alert(data.error || 'AI 分析失敗，請重拍一張光線充足的照片');
      go('s-welcome');
    }
  } catch (err) {
    stopScan();
    console.error(err);
    alert('連線失敗，請稍後再試');
    go('s-welcome');
  }
}

// ══ 掃描動畫 ══
const SCANS = ['sc1','sc2','sc3','sc4'];
function startScan() {
  scanIdx = 0;
  SCANS.forEach(id => document.getElementById(id).className = 'scan-row');
  activateScan(0);
  scanTimer = setInterval(() => {
    scanIdx++;
    if (scanIdx < SCANS.length) activateScan(scanIdx);
    else clearInterval(scanTimer);
  }, 900);
}
function activateScan(i) {
  if (i > 0) document.getElementById(SCANS[i-1]).className = 'scan-row done';
  document.getElementById(SCANS[i]).className = 'scan-row on';
}
function stopScan() {
  clearInterval(scanTimer);
  SCANS.forEach(id => document.getElementById(id).className = 'scan-row done');
}

// ══ 渲染結果 ══
function renderResult(data) {
  const { detected_issues = [], recommendations = [], overall_note = '', consultation_suggested } = data;

  document.getElementById('r-overall').textContent = overall_note || '分析完成，請查看以下推薦療程。';

  // Issues
  const issWrap = document.getElementById('r-issues');
  issWrap.innerHTML = detected_issues.map(iss => {
    const sevClass = iss.severity === '明顯' ? 'sev-hi' : iss.severity === '中度' ? 'sev-mid' : '';
    return `<div class="issue-pill">
      <div class="issue-bar ${sevClass}"></div>
      <div>
        <div class="issue-name">${iss.issue}（${iss.severity || ''}）</div>
        <div class="issue-desc">${iss.description || ''}</div>
      </div>
    </div>`;
  }).join('') || '<div class="issue-pill"><div class="issue-bar"></div><div><div class="issue-name">膚況良好</div></div></div>';

  // Recs
  const RANKS = ['🥇','🥈','🥉'];
  const recWrap = document.getElementById('r-recs');
  recWrap.innerHTML = recommendations.map((r, i) => `
    <div class="rec-card">
      <div class="rec-card-top">
        <div class="rec-rank">${RANKS[i] || '✨'}</div>
        <div class="rec-info">
          <div class="rec-name">${r.service}</div>
          <div class="rec-cat">${r.category || ''}</div>
        </div>
      </div>
      <div class="rec-body">
        <div class="rec-reason">${r.reason}</div>
        <div class="rec-effect">✨ ${r.benefit}</div>
      </div>
    </div>`).join('') || '<div class="rec-card"><div class="rec-card-top"><div class="rec-rank">💆</div><div class="rec-info"><div class="rec-name">建議到院進行完整評估</div></div></div></div>';

  // Note
  const note = document.getElementById('r-note');
  note.textContent = data.overall_note
    ? '以上為 AI 初步評估，實際療程規劃建議與專業醫師面談後確認，以獲得最佳效果。'
    : '';
}

// ══ 啟動 ══
document.addEventListener('DOMContentLoaded', initLiff);
</script>
</body>
</html>
